<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <script defer type="module" src="app.js"></script>
    <title>my lovely chatbot</title>
  
</head>
<body>
<header>
    <div class="head-div">
    <h1>PlantBot</h1>
    </div>
</header>

<div class="chat"></div>
<form class="form" action="" method="POST">
    <div class="left-form">
        <div class="row">
            <label for="name">Name</label>
            <input type="text" name="name" id="name" placeholder="plant naam..."/>
        </div>
        <div class="row">
            <label for="temperature">temperature</label>
            <input type="text" name="temperature" id="temperature" placeholder="1234..."/>
        </div>
        <div class="row">
            <label for="humidity">Humidity</label>
            <input type="text" name="humidity" id="humidity" placeholder="1234%..."/>
        </div>
        <div class="row">
            <label for="ph">PH</label>
            <input type="text" name="ph" id="ph" placeholder="1234..."/>
        </div>
    </div>
    <div class="prompt">
        <label for="prompt"></label>
        <input type="text" name="prompt" id="prompt" placeholder="prompt zin hier..." required/>

        <button id="button" type="submit">Verstuur</button>
    </div>
</form>
</body>
</html>
